<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Burst - Neon Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a12;
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Background Grid Futuristik yang Bergerak Ramai */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* Desain Kontainer Minimalis & Premium */
        .game-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.1);
            width: 360px;
            max-width: 90%;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .rank-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff007f;
            border: 1px solid #ff007f;
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }
        .score-box {
            font-size: 4rem;
            font-weight: 800;
            margin: 10px 0 30px 0;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            font-variant-numeric: tabular-nums;
        }
        /* Tombol Utama Minimalis Bulat Sempurna */
        .click-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid #00ffcc;
            background: transparent;
            color: #00ffcc;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            transition: all 0.1s ease;
            outline: none;
            position: relative;
            overflow: hidden;
        }
        .click-btn:hover {
            background: rgba(0, 255, 204, 0.05);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
        }
        .click-btn:active {
            transform: scale(0.95);
            border-color: #ff007f;
            color: #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }
        .instruction {
            margin-top: 25px;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #888899;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="game-card">
        <h1>CYBER BURST</h1>
        <div class="rank-badge" id="rankBadge">LEVEL 01</div>
        <div class="score-box" id="scoreDisplay">0</div>
        <button class="click-btn" id="mainClickBtn">CORE</button>
        <p class="instruction">TAP ANYWHERE TO GENERATE ENERGY</p>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const rankBadge = document.getElementById('rankBadge');
        const mainClickBtn = document.getElementById('mainClickBtn');

        let score = 0;
        let particles = [];
        let gridOffset = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Audio Synth Generator (Suara laser/klik futuristik)
        let audioCtx;
        function playLaserSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Kelas Efek Klik (Spark Neon)
        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 2;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 6 + 4;
                this.color = score % 2 === 0 ? '#00ffcc' : '#ff007f';
                this.opacity = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.speed *= 0.96; 
                this.opacity -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function doClick(e) {
            score++;
            scoreDisplay.textContent = score;
            try { playLaserSound(); } catch(err) {}
            updateRank();

            const clientX = e.clientX || (e.touches && e.touches.clientX) || window.innerWidth / 2;
            const clientY = e.clientY || (e.touches && e.touches.clientY) || window.innerHeight / 2;

            // Memunculkan percikan cahaya neon
            for (let i = 0; i < 12; i++) {
                particles.push(new Spark(clientX, clientY));
            }
        }

        function updateRank() {
            if (score > 150) {
                rankBadge.textContent = "OVERLORD";
                rankBadge.style.color = "#ffff00";
                rankBadge.style.borderColor = "#ffff00";
            } else if (score > 80) {
                rankBadge.textContent = "NETRUNNER";
                rankBadge.style.color = "#00ffcc";
                rankBadge.style.borderColor = "#00ffcc";
            } else if (score > 30) {
                rankBadge.textContent = "CYPHER";
                rankBadge.style.color = "#ff007f";
                rankBadge.style.borderColor = "#ff007f";
            }
        }

        mainClickBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            doClick(e);
        });
        window.addEventListener('click', (e) => {
            doClick(e);
        });

        // Loop Animasi Utama (Menggambar Grid & Spark)
        function animate() {
            // Latar Belakang Gelap Ringan
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Menggambar Grid Cyberpunk Bergerak Otomatis (Selalu Ramai)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.04)';
            ctx.lineWidth = 1;
            gridOffset = (gridOffset + 0.5) % 40;

            for (let x = gridOffset; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = gridOffset; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Jalankan Partikel Neon
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
