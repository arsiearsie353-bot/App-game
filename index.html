<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Clicker Heboh & Ramai!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Background Canvas yang Selalu Ramai */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        /* Kontainer Utama Game */
        .game-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 380px;
            animation: floatCard 4s ease-in-out infinite;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            color: #fff;
        }
        .score-box {
            font-size: 3rem;
            font-weight: bold;
            margin: 15px 0;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
        .combo-badge {
            display: inline-block;
            background: #ff007f;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px #ff007f;
            margin-bottom: 25px;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        /* Tombol Utama */
        .click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, #ff007f, #ff7b00);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.5), inset 0 0 15px rgba(255,255,255,0.5);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .click-btn:active {
            transform: scale(0.9);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.7);
        }
        .instruction {
            margin-top: 20px;
            font-size: 0.85rem;
            opacity: 0.7;
            color: #e0e0e0;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="game-card">
        <h1>EMOJI BURST!</h1>
        <div class="combo-badge" id="rankBadge">Pemula 😎</div>
        <div class="score-box" id="scoreDisplay">0</div>
        <button class="click-btn" id="mainClickBtn">KLIK!</button>
        <p class="instruction">Klik tombol atau area mana saja untuk membuat keramaian!</p>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const rankBadge = document.getElementById('rankBadge');
        const mainClickBtn = document.getElementById('mainClickBtn');

        let score = 0;
        const emojis = ['🔥', '✨', '⚡', '🎉', '🌟', '🚀', '💥', '👾', '🌈', '👑'];
        let particles = [];
        let ambientParticles = [];

        // Menyesuaikan ukuran canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Audio Generator Sistem (Tanpa perlu file musik eksternal)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPopSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(150 + Math.random() * 400, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        // Kelas untuk Partikel Ledakan Klik
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.size = Math.random() * 20 + 20;
                this.speedX = Math.random() * 10 - 5;
                this.speedY = Math.random() * 10 - 8;
                this.gravity = 0.2;
                this.opacity = 1;
                this.fade = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.opacity -= this.fade;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        // Kelas untuk Efek Latar Belakang yang Selalu Ramai
        class AmbientParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Mulai acak di layar saat awal beban
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.size = Math.random() * 15 + 15;
                this.speedY = -(Math.random() * 2 + 1);
                this.speedX = Math.sin(Math.random() * 2) * 1;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 30) * 0.5; // Bergerak meliuk-liuk
                if (this.y < -50) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        // Inisialisasi background yang ramai (50 partikel mengambang konstan)
        for (let i = 0; i < 50; i++) {
            ambientParticles.push(new AmbientParticle());
        }

        // Logika Aksi Klik Utama
        function doClick(e) {
            score++;
            scoreDisplay.textContent = score;
            playPopSound();
            updateRank();

            // Koordinat efek ledakan
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2;

            // Membuat 8 emoji melompat keluar saat diklik
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(clientX, clientY));
            }
        }

        // Update Pangkat/Rank berdasarkan skor agar seru
        function updateRank() {
            if (score > 100) {
                rankBadge.textContent = "DEWA CLICKER Mts 🏆";
                rankBadge.style.background = "linear-gradient(45deg, #ff00ff, #00ffff)";
            } else if (score > 50) {
                rankBadge.textContent = "Master Pro 🔥";
                rankBadge.style.background = "#00ffcc";
                rankBadge.style.color = "#000";
            } else if (score > 20) {
                rankBadge.textContent = "Penjelajah 🚀";
                rankBadge.style.background = "#ff7b00";
            }
        }

        // Pasang Event Listener Klik
        mainClickBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Mencegah klik ganda dari window listener
            doClick(e);
        });
        window.addEventListener('click', (e) => {
            doClick(e);
        });

        // Loop Animasi Utama
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Jalankan & Gambar Background Ramai
            ambientParticles.forEach(p => {
                p.update();
                p.draw();
            });

            // Jalankan & Gambar Efek Klik
